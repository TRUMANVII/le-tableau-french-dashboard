<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Le Tableau</title>
<meta name="description" content="A phone-first French learning dashboard with pronunciation scoring and adaptive coaching." />

<!-- PWA / home screen metadata -->
<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#1F2B27" />

<!-- iOS home screen behavior -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Le Tableau" />
<link rel="apple-touch-icon" href="./icons/icon-192.png" />

<link rel="icon" href="./icons/icon-192.png" />

<style>
  html, body { margin: 0; padding: 0; background: #1F2B27; }
  #root { min-height: 100vh; }
  /* Avoid the iOS "bounce" white flash and text-selection callouts feeling un-app-like */
  body { overscroll-behavior-y: none; -webkit-tap-highlight-color: transparent; }
</style>

<!-- Import map: load React/lucide-react as ES modules with no bundler -->
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
    "lucide-react": "https://esm.sh/lucide-react@0.383.0?external=react"
  }
}
</script>

<!-- Babel standalone: transpiles JSX in the browser, no build step needed -->
<script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" crossorigin></script>
</head>
<body>
<div id="root"></div>

<!-- The dashboard component (imported below), mounted into #root -->
<script type="text/babel" data-type="module" data-presets="react">
  import { createRoot } from 'react-dom/client';
  import FrenchDashboard from './french-dashboard.jsx';
  createRoot(document.getElementById('root')).render(<FrenchDashboard />);
</script>

<!-- Register service worker for basic offline shell caching -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js').catch(() => {});
    });
  }
</script>
</body>
</html>
